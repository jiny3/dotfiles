services:
  caddy:
    image: ghcr.io/hotio/caddy:latest
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - $HOME/dotfiles/caddy/certs/:/certs:ro
      - $HOME/dotfiles/caddy/config:/config
      - $HOME/dotfiles/caddy/data:/data
  alist:
    image: "docker.io/xhofe/alist:latest"
    container_name: alist
    volumes:
      - "$HOME/.var/alist:/opt/alist/data"
    expose:
      - 5244
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Asia/Shanghai
    restart: unless-stopped
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - $HOME/.var/vaultwarden:/data
    expose:
      - 80
    environment:
      - DOMAIN=https://vault.arch
